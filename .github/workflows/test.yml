name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  django:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        janeway: ["v1.8.2", "master"]
    env:
      JANEWAY_SETTINGS_MODULE: core.dev_settings
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin

      # A plain clone, not actions/checkout: Janeway v1.8.2 has a submodule
      # gitlink (src/texture) with no .gitmodules URL, which makes checkout's
      # post-job submodule cleanup fail with a warning.
      - name: Clone Janeway
        env:
          JANEWAY_REF: ${{ matrix.janeway }}
        run: git clone --depth 1 --branch "$JANEWAY_REF" https://github.com/openlibhums/janeway.git janeway

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: janeway/requirements.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libmagic1 pandoc

      - name: Install Janeway requirements
        run: pip install -r janeway/requirements.txt

      - name: Link plugin into Janeway
        run: ln -s "$GITHUB_WORKSPACE/plugin" janeway/src/plugins/jats_editor

      - name: Run plugin tests
        working-directory: janeway/src
        run: python manage.py test plugins/jats_editor/tests --top-level-directory . --noinput
