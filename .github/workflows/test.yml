name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  django:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        janeway: ["v1.8.2", "master"]
    env:
      JANEWAY_SETTINGS_MODULE: core.dev_settings
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/checkout@v4
        with:
          repository: openlibhums/janeway
          ref: ${{ matrix.janeway }}
          path: janeway

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: janeway/requirements.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libmagic1 pandoc

      - name: Install Janeway requirements
        run: pip install -r janeway/requirements.txt

      - name: Link plugin into Janeway
        run: ln -s "$GITHUB_WORKSPACE/plugin" janeway/src/plugins/jats_editor

      - name: Run plugin tests
        working-directory: janeway/src
        run: python manage.py test plugins/jats_editor/tests --top-level-directory . --noinput
